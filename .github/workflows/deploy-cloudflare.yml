# Deploy to Cloudflare Workers — GENERATED by
# Business-Empire-Agent `scripts/integrations/wrangler_tool.py workflow --app propflow`.
# Regenerate rather than hand-editing (the build env is derived from the app's
# secret manifest, which is the single source of truth for key NAMES).
#
# WHAT THIS DOES: every push to main builds the Worker with @opennextjs/cloudflare and deploys it.
# WHAT IT DOES NOT DO: push Worker SECRETS. Those stay operator-managed from the
# agents env store (`wrangler_tool.py secrets-push --app propflow`) — a deploy does
# not clear a Worker's existing secrets, so CI never needs them at runtime.
#
# REQUIRED REPO SECRETS (CC adds these in Settings → Secrets → Actions):
#   CLOUDFLARE_API_TOKEN   — Workers Scripts:Edit on the deploying account
#   CLOUDFLARE_ACCOUNT_ID  — e371c0f2dfde76e329b351a54bc738fe
#   -- every manifest key: the build needs runtime secrets too,
#      because module-scope SDK init runs during page-data collection
#   AUTH_SESSION_SECRET
#   CLOUDFLARE_ACCOUNT_ID
#   CRON_SECRET
#   EMPIRE_AUTH_BACKEND
#   EMPIRE_DATA_BACKEND
#   GOOGLE_CLIENT_ID
#   GOOGLE_CLIENT_SECRET
#   LATE_API_KEY
#   N8N_API_KEY
#   NEXT_PUBLIC_APP_URL  (inlined into the client bundle)
#   NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY  (inlined into the client bundle)
#   NEXT_PUBLIC_SUPABASE_ANON_KEY  (inlined into the client bundle)
#   NEXT_PUBLIC_SUPABASE_URL  (inlined into the client bundle)
#   PROPFLOW_GMAIL_APP_PASSWORD
#   PROPFLOW_MASTER_EMAIL
#   R2_ACCESS_KEY_ID
#   R2_BUCKET
#   R2_PUBLIC_BASE_URL
#   R2_SECRET_ACCESS_KEY
#   RUNPOD_API_KEY
#   STRIPE_SECRET_KEY
#   STRIPE_WEBHOOK_SIGNING_SECRET
#   SUPABASE_SERVICE_ROLE_KEY
#   TURSO_AUTH_TOKEN
#   TURSO_DATABASE_URL
#   WALKTHROUGH_WEBHOOK_SECRET
#   WEBHOOK_SECRET
#   WORKER_SHARED_SECRET
#   NEXT_PUBLIC_SUPER_ADMIN_EMAILS  (inlined into the client bundle)
#   SUPER_ADMIN_EMAILS
#
# Until CLOUDFLARE_API_TOKEN exists the job still BUILDS (real signal on build
# breakage) and SKIPS the deploy with a warning — no red CI while the migration
# waits on operator gates.
name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cf-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # NOTE: the deploy step below is gated on this step's OUTPUT, not on
      # `if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}`. GitHub does not expose
      # the `secrets` context to `if:` at job OR step level (docs, Context
      # availability: step-level `if` gets github/needs/strategy/matrix/job/
      # runner/env/vars/steps/inputs only). Written that way the condition never
      # sees the token, evaluates false, and the deploy SILENTLY never runs.
      # Reading the secret into `env` here is the supported workaround.
      - name: Preflight - is the Cloudflare token configured?
        id: preflight
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            # notice, not warning: an un-provisioned repo is an expected state
            # during the migration and must not decorate every run with a
            # yellow annotation operators learn to ignore.
            echo "::notice::CLOUDFLARE_API_TOKEN not set - build-only run, deploy skipped."
          fi

      - name: Build (OpenNext -> Cloudflare Worker)
        run: npx opennextjs-cloudflare build
        env:
          CF_MIGRATION_BUILD: "1"
          AUTH_SESSION_SECRET: ${{ secrets.AUTH_SESSION_SECRET }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          EMPIRE_AUTH_BACKEND: ${{ secrets.EMPIRE_AUTH_BACKEND }}
          EMPIRE_DATA_BACKEND: ${{ secrets.EMPIRE_DATA_BACKEND }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          LATE_API_KEY: ${{ secrets.LATE_API_KEY }}
          N8N_API_KEY: ${{ secrets.N8N_API_KEY }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          PROPFLOW_GMAIL_APP_PASSWORD: ${{ secrets.PROPFLOW_GMAIL_APP_PASSWORD }}
          PROPFLOW_MASTER_EMAIL: ${{ secrets.PROPFLOW_MASTER_EMAIL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SIGNING_SECRET: ${{ secrets.STRIPE_WEBHOOK_SIGNING_SECRET }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          WALKTHROUGH_WEBHOOK_SECRET: ${{ secrets.WALKTHROUGH_WEBHOOK_SECRET }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          WORKER_SHARED_SECRET: ${{ secrets.WORKER_SHARED_SECRET }}
          NEXT_PUBLIC_SUPER_ADMIN_EMAILS: ${{ secrets.NEXT_PUBLIC_SUPER_ADMIN_EMAILS }}
          SUPER_ADMIN_EMAILS: ${{ secrets.SUPER_ADMIN_EMAILS }}

      - name: Deploy to Cloudflare Workers
        if: steps.preflight.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
